# R CMD check matrix — OS × R release/devel/oldrel
# Requires GitHub Actions. Uses r-lib/actions.
name: R-CMD-check

on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest,  r: "release" }
          - { os: ubuntu-latest,  r: "devel" }
          - { os: ubuntu-latest,  r: "oldrel-1" }
          - { os: macos-latest,   r: "release" }
          - { os: windows-latest, r: "release" }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'devel' && 'release' || '' }}
          use-public-bspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::covr
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          # Environmental NOTEs (new submission / clock) are documented; do not fail CI on them.

  coverage:
    runs-on: ubuntu-latest
    name: covr (evaluator/context/store/events)
    needs: R-CMD-check
    if: github.event_name != 'schedule'
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Soft until parent-process coverage reaches 90% (worker IPC invisible to covr).
      LD_COVERAGE_SOFT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-bspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::testthat, any::pkgload, any::webfakes, any::httpuv
          needs: coverage
      - name: Coverage gate (≥90% on core modules)
        run: Rscript scripts/coverage-gate.R
